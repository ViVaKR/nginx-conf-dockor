# ====================================================================
# 🧭 NGINX REGEX & LOCATION CHEAT SHEET (외계어 해독 비망록)
# ====================================================================

# [1] location 매칭 우선순위 기호
#   location = /path      : 1순위 (정확히 100% 일치)
#   location ^~ /path     : 2순위 (이걸로 시작하면 뒤쪽 정규식 전부 무시하고 확정)
#   location ~ \.regex$   : 3순위 (정규식 매칭, 대소문자 엄격 구분)
#   location ~* \.regex$  : 3순위 (정규식 매칭, 대소문자 무시 insensitive)
#   location /path        : 4순위 (일반 전방 일치 - 가장 낮은 우선순위)
#
# [2] 정규식 핵심 특수기호
#   \   : 이스케이프 (뒤따르는 기호를 순수한 문자로 취급, 예: \. = 진짜 점)
#   ^   : 문자열의 시작 (예: ^/api = /api로 시작하는 주소)
#   $   : 문자열의 끝   (예: \.png$ = .png로 끝나는 주소)
#   |   : OR 연산자    (예: (jpg|png|webp) = 세 개 중 하나)
#   ()  : 그룹화       (파이프 | 와 함께 묶을 때 사용)
# ====================================================================

# ===============================================
# 🌍 HTTP to HTTPS Redirect
# ===============================================
server {
	listen 80;
	server_name kimbumjun.com;
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    server_name kimbumjun.com;
    charset utf-8;
    root /var/www/kimbumjun/current;
    index index.html;

    # ------------------------------------------------
    # 1. 📝 Log
    # ------------------------------------------------
	access_log /var/log/nginx/kimbumjun.com.access.log;
	error_log  /var/log/nginx/kimbumjun.com.error.log;

    # ------------------------------------------------
    # 2. 🔐 SSL
    # ------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/kimbumjun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kimbumjun.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ------------------------------------------------
    # 3. 🔒 보안 헤더
    # ------------------------------------------------
    include /etc/nginx/snippets/security-header.conf;
    include /etc/nginx/snippets/csp-global.conf;

    # ------------------------------------------------
    # 4. 🚀 GZIP
    # ------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    # ================================================
    # 5. 🗺️ Location 블록
    # ================================================

    # 💊 Health Check
    #  정확한 일치 (가장 높은 우선순위)
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }

    # 🚫 robots.txt (선택사항)
    location = /robots.txt {
        access_log off;
    }

    # ================================================
    # 6. 🔐 보안 강화
    # ================================================

    # 숨겨진 파일 및 민감한 파일 차단
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 민감한 파일 접근 차단
    location ~* \.(env|git|gitignore|htaccess|htpasswd|ini|log|sh|sql|conf|bak|swp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ================================================
    # 7. 🎨 정적 파일 캐싱 (타입별 최적화)
    # ===============================================

    # 이미지 파일 (1년)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|bmp)$ {
        include /etc/nginx/snippets/security-header.conf;
        include /etc/nginx/snippets/csp-global.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS/JS (1년)
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-header.conf;
        include /etc/nginx/snippets/csp-global.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 폰트 (1년)
    location ~* \.(woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-header.conf;
        include /etc/nginx/snippets/csp-global.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # HTML (캐시 안 함 - 항상 최신)
    location ~* \.html$ {
        include /etc/nginx/snippets/security-header.conf;
        include /etc/nginx/snippets/csp-global.conf;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # =================================================
    # 8. 🌐 기본 루트 (SPA 라우팅 Fallback)
    # =================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
